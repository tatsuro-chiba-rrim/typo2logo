<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="千葉達朗（Tatsuro Chiba）">
<meta name="description" content="Text and image logo generator using recursive inward and outward buffers.">
<title>Typo2Logo</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717;background:#f4f4f2}
*{box-sizing:border-box}body{margin:0}
header{padding:18px 24px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center}
header b{font-size:22px;letter-spacing:.04em}header span{font-size:12px;color:#aaa}
main{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 116px)}
aside{padding:20px;background:#fff;border-right:1px solid #ddd;overflow:auto}
.preview{display:flex;align-items:center;justify-content:center;padding:28px;min-width:0}
.stage{width:min(100%,1120px)}
canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 8px 32px #0001}
.status{margin-top:8px;color:#777;font-size:11px;display:flex;justify-content:space-between;gap:12px}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 5px}
input[type=text],select,input[type=file]{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px;background:#fff}
input[type=range]{width:100%;accent-color:#339cff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color{display:flex;gap:8px;min-width:0}.color input[type=color]{width:46px;height:38px;flex:0 0 46px;border:0;background:none}.color input[type=text]{min-width:0}
button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:wait}.primary{background:#258eea;color:white}.secondary{background:#e8e8e5}
.buttons{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
small{color:#777;line-height:1.5}.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.source-panel[hidden]{display:none}.source-panel{padding-bottom:2px}.image-note{display:block;margin-top:6px}
footer{min-height:54px;padding:14px 24px;background:#111;color:#aaa;display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:12px}
footer strong{color:#fff;font-weight:700}footer a{color:#fff;text-decoration:none;border-bottom:1px solid #777;padding-bottom:1px}footer a:hover{border-color:#fff}
@media(max-width:760px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}.preview{padding:12px}footer{align-items:flex-start;flex-direction:column;gap:6px}}
</style>
</head>
<body>
<header><b>Typo2Logo</b><span>recursive-buffer logo maker</span></header>
<main>
<aside>
<label>SOURCE</label>
<select id="sourceType"><option value="text">Text + Font</option><option value="image">Image</option></select>
<div id="textSource" class="source-panel">
<label>TEXT</label><input id="text" type="text" value="RRIM">
<label>FONT</label>
<select id="font">
<option>Arial Black</option><option>Arial</option><option>Impact</option>
<option>Georgia</option><option>Times New Roman</option><option>Trebuchet MS</option>
<option>Verdana</option><option>Courier New</option><option>Yu Gothic</option><option>Yu Mincho</option>
</select>
<label>OPTIONAL: LOAD LOCAL FONT</label><input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2"><small>未選択なら上の標準フォントを使用します。</small>
<div class="row">
<div><label>FONT SIZE <span id="fsV"></span></label><input id="fs" type="range" min="120" max="650" value="430"></div>
<div><label>WEIGHT</label><select id="weight"><option>900</option><option>800</option><option>700</option><option>600</option><option>400</option></select></div>
</div>
<label>LETTER SPACING <span id="lsV"></span></label><input id="letterSpacing" type="range" min="-60" max="160" value="0" step="1">
</div>
<div id="imageSource" class="source-panel" hidden>
<label>IMAGE FILE</label><input id="imageFile" type="file" accept="image/*">
<small class="image-note">透明PNGは透明度を、JPEGなどは明るさを自動的にマスクへ変換します。</small>
<div class="row">
<div><label>IMAGE SIZE <span id="imageScaleV"></span></label><input id="imageScale" type="range" min="20" max="130" value="100" step="1"></div>
<div><label>THRESHOLD <span id="thresholdV"></span></label><input id="threshold" type="range" min="0" max="254" value="220" step="1"></div>
</div>
<label class="check"><input id="imageInvert" type="checkbox"> Invert brightness mask</label>
</div>
<div class="row">
<div><label>MODE</label><select id="mode"><option value="lines">Waterline</option><option value="fill">Fill + Waterline</option><option value="distance">Distance field</option></select></div>
<div><label>LINE REGION</label><select id="lineRegion"><option value="inside">Inside</option><option value="outside">Outside</option><option value="both" selected>Inside + Outside</option></select></div>
</div>
<div class="row">
<div><label>BUFFER SCALE <span id="spV"></span></label><input id="spacing" type="range" min="3" max="45" value="14"></div>
<div><label>LINE WIDTH <span id="lwV"></span></label><input id="lineWidth" type="range" min="1" max="12" value="3"></div>
</div>
<label>SHAPE FILL</label>
<div class="color"><input id="c1" type="color" value="#339cff"><input id="c1t" type="text" value="#339cff"></div>
<div class="row">
<div><label>INNER LINES</label><div class="color"><input id="c2" type="color" value="#95c2ec"><input id="c2t" type="text" value="#95c2ec"></div></div>
<div><label>OUTER LINES</label><div class="color"><input id="c3" type="color" value="#f3883b"><input id="c3t" type="text" value="#f3883b"></div></div>
</div>
<label>SHAPE BOUNDARY</label>
<div class="color"><input id="c4" type="color" value="#2c2927"><input id="c4t" type="text" value="#2c2927"></div>
<label>BACKGROUND</label><div class="color"><input id="bg" type="color" value="#ffffff"><input id="bgt" type="text" value="#ffffff"></div>
<label class="check"><input id="gradient" type="checkbox" checked> Smooth color gradient</label>
<label class="check"><input id="reverse" type="checkbox"> Reverse gradient</label>
<label class="check"><input id="transparent" type="checkbox"> Transparent background</label>
<div class="buttons"><button class="primary" id="run">RUN</button><button class="secondary" id="png">SAVE PNG</button><button class="secondary" id="reset">RESET</button></div>
<p><small>文字または画像の輪郭を「湖岸線」として、内側と外側へ再帰バッファー状の平行線を描きます。画像も高解像度の連続距離面で処理し、線分の継ぎ合わせを使わず滑らかに連続する線にします。線色は湖岸線からの距離に応じて滑らかに補間します。</small></p>
</aside>
<section class="preview"><div class="stage"><canvas id="out" width="1600" height="800"></canvas><div class="status"><span id="status">準備中</span><span>1600 × 800 px</span></div></div></section>
</main>
<footer>
  <div>© 2026 <strong>千葉達朗（千葉研究室） / Tatsuro Chiba</strong></div>
  <a href="https://www.facebook.com/arukazan" target="_blank" rel="noopener noreferrer" aria-label="千葉達朗のFacebookページを開く">Facebook: @arukazan ↗</a>
</footer>
<script>
const $=id=>document.getElementById(id),out=$("out"),ctx=out.getContext("2d",{alpha:true,willReadFrequently:true});
const W=out.width,H=out.height;
const IMAGE_SS=2,IW=W*IMAGE_SS,IH=H*IMAGE_SS;
const mask=document.createElement("canvas");mask.width=W;mask.height=H;
const mctx=mask.getContext("2d",{alpha:true,willReadFrequently:true});
const lines=document.createElement("canvas");lines.width=W;lines.height=H;
const lctx=lines.getContext("2d",{alpha:true});
const sourceFill=document.createElement("canvas");sourceFill.width=W;sourceFill.height=H;
const fctx=sourceFill.getContext("2d",{alpha:true});
const imageMask=document.createElement("canvas");imageMask.width=IW;imageMask.height=IH;
const imctx=imageMask.getContext("2d",{alpha:true,willReadFrequently:true});
const imageLines=document.createElement("canvas");imageLines.width=IW;imageLines.height=IH;
const ilctx=imageLines.getContext("2d",{alpha:true});
const imageOutput=document.createElement("canvas");imageOutput.width=IW;imageOutput.height=IH;
const ioctx=imageOutput.getContext("2d",{alpha:true});
const BUFFER_DISTANCES=[0.5,1,1.5,2,2.5,3,4,5,6,7,9,11,13,17,21,25,30];
let localFont=null,sourceImage=null,imageFileName="image",binaryMask=null,maskAlpha=null,distanceField=null,outsideDistanceField=null,maxDistance=1,layout=null,generation=0,imageRenderTimer=null;

function hex(value){
  let s=String(value).trim().replace("#","");
  if(/^[0-9a-f]{3}$/i.test(s))s=s.split("").map(c=>c+c).join("");
  return /^[0-9a-f]{6}$/i.test(s)?[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]:null;
}
function cssColor(rgb){return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));return [0,1,2].map(i=>Math.round(a[i]*(1-t)+b[i]*t))}

function edt1d(f,n){
  const d=new Float64Array(n),v=new Int32Array(n),z=new Float64Array(n+1);let k=0;
  v[0]=0;z[0]=-Infinity;z[1]=Infinity;
  for(let q=1;q<n;q++){
    let s;
    do{const p=v[k];s=((f[q]+q*q)-(f[p]+p*p))/(2*q-2*p);if(s<=z[k])k--}while(s<=z[k]);
    k++;v[k]=q;z[k]=s;z[k+1]=Infinity;
  }
  k=0;for(let q=0;q<n;q++){while(z[k+1]<q)k++;const dx=q-v[k];d[q]=dx*dx+f[v[k]]}
  return d;
}
function distanceTransform(binary,width=W,height=H){
  const INF=1e15,tmp=new Float64Array(width*height),result=new Float32Array(width*height),f=new Float64Array(Math.max(width,height));
  for(let y=0;y<height;y++){
    const row=y*width;for(let x=0;x<width;x++)f[x]=binary[row+x]?INF:0;
    const d=edt1d(f,width);for(let x=0;x<width;x++)tmp[row+x]=d[x];
  }
  for(let x=0;x<width;x++){
    for(let y=0;y<height;y++)f[y]=tmp[y*width+x];
    const d=edt1d(f,height);for(let y=0;y<height;y++)result[y*width+x]=Math.sqrt(d[y]);
  }
  return result;
}

function setTextStyle(target){
  target.font=`${layout.weight} ${layout.size}px "${layout.family}"`;
  target.textAlign="left";target.textBaseline="alphabetic";
}
function measureTrackedText(target,text,spacing){
  const glyphs=Array.from(text),naturalWidth=target.measureText(text).width;
  return {glyphs,naturalWidth,totalWidth:Math.max(1,naturalWidth+spacing*Math.max(0,glyphs.length-1))};
}
function positionGlyphs(target,text,spacing,centerX){
  const chars=Array.from(text),naturalWidth=target.measureText(text).width;
  const left=centerX-(naturalWidth+spacing*Math.max(0,chars.length-1))/2,glyphs=[];
  let prefix="",prefixWidth=0;
  for(let i=0;i<chars.length;i++){
    const char=chars[i],charWidth=target.measureText(char).width;
    const nextPrefix=prefix+char,nextWidth=target.measureText(nextPrefix).width;
    const kerning=nextWidth-prefixWidth-charWidth;
    glyphs.push({char,x:left+prefixWidth+kerning+spacing*i});
    prefix=nextPrefix;prefixWidth=nextWidth;
  }
  return glyphs;
}
function fillGlyphs(target){
  setTextStyle(target);
  for(const glyph of layout.glyphs)target.fillText(glyph.char,glyph.x,layout.y);
}
function sourceIsImage(){return $("sourceType").value==="image"}
function maskBounds(binary,width=W,height=H){
  let minX=width,minY=height,maxX=-1,maxY=-1,count=0;
  for(let i=0;i<binary.length;i++)if(binary[i]){
    const x=i%width,y=(i/width)|0;count++;
    if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;
  }
  if(!count)return null;
  return {minX,minY,maxX,maxY,count,margin:Math.min(minX,minY,width-1-maxX,height-1-maxY)};
}
function makeTextMask(){
  mctx.clearRect(0,0,W,H);mctx.fillStyle="#fff";
  const text=$("text").value||"RRIM",family=localFont||$("font").value,weight=$("weight").value,spacing=+$("letterSpacing").value;
  let size=+$("fs").value;
  for(let pass=0;pass<3;pass++){
    mctx.font=`${weight} ${size}px "${family}"`;
    const metrics=mctx.measureText(text),tracked=measureTrackedText(mctx,text,spacing);
    const measuredHeight=(metrics.actualBoundingBoxAscent||size*.75)+(metrics.actualBoundingBoxDescent||size*.25);
    const factor=Math.min(1,W*.88/tracked.totalWidth,H*.72/Math.max(1,measuredHeight));
    if(factor>=.999)break;size*=factor;
  }
  mctx.font=`${weight} ${size}px "${family}"`;const metrics=mctx.measureText(text);
  const ascent=metrics.actualBoundingBoxAscent||size*.75,descent=metrics.actualBoundingBoxDescent||size*.25;
  layout={kind:"text",text,family,weight,size,spacing,y:(H+ascent-descent)/2};
  setTextStyle(mctx);layout.glyphs=positionGlyphs(mctx,text,spacing,W/2);fillGlyphs(mctx);
  const rgba=mctx.getImageData(0,0,W,H).data;
  const binary=new Uint8Array(W*H),alpha=new Uint8Array(W*H);
  for(let i=0;i<binary.length;i++){
    alpha[i]=rgba[i*4+3];binary[i]=alpha[i]>=96?1:0;
  }
  const bounds=maskBounds(binary);
  layout.outerLimit=Math.max(4,(bounds?bounds.margin:40)-6);
  return {binary,alpha};
}
function makeImageMask(){
  if(!sourceImage)return null;
  imctx.globalCompositeOperation="source-over";imctx.clearRect(0,0,IW,IH);
  imctx.imageSmoothingEnabled=true;imctx.imageSmoothingQuality="high";
  const fit=Math.min(IW*.88/sourceImage.naturalWidth,IH*.72/sourceImage.naturalHeight);
  const scale=fit*(+$('imageScale').value/100);
  const drawW=Math.max(1,sourceImage.naturalWidth*scale),drawH=Math.max(1,sourceImage.naturalHeight*scale);
  const drawX=(IW-drawW)/2,drawY=(IH-drawH)/2;
  imctx.drawImage(sourceImage,drawX,drawY,drawW,drawH);
  const source=imctx.getImageData(0,0,IW,IH),rgba=source.data;
  const x0=Math.max(0,Math.floor(drawX)),x1=Math.min(IW,Math.ceil(drawX+drawW));
  const y0=Math.max(0,Math.floor(drawY)),y1=Math.min(IH,Math.ceil(drawY+drawH));
  let translucent=0,sampled=0;
  for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){
    const a=rgba[(y*IW+x)*4+3];sampled++;if(a<250)translucent++;
  }
  const useAlpha=sampled>0&&translucent/sampled>.01;
  const threshold=+$('threshold').value,invert=$('imageInvert').checked;
  const binary=new Uint8Array(IW*IH),alpha=new Uint8Array(IW*IH);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const i=y*IW+x,p=i*4,a=rgba[p+3];let selected;
    if(useAlpha){selected=a>=threshold}
    else{
      const luminance=.2126*rgba[p]+.7152*rgba[p+1]+.0722*rgba[p+2];
      selected=invert?luminance>=threshold:luminance<=threshold;
    }
    if(selected&&a>0){binary[i]=1;alpha[i]=255}
  }
  const bounds=maskBounds(binary,IW,IH);
  if(!bounds)return null;
  const maskImage=imctx.createImageData(IW,IH),md=maskImage.data;
  for(let i=0;i<binary.length;i++)if(binary[i]){const p=i*4;md[p]=255;md[p+1]=255;md[p+2]=255;md[p+3]=255}
  imctx.clearRect(0,0,IW,IH);imctx.putImageData(maskImage,0,0);
  layout={kind:"image",name:imageFileName,maskMode:useAlpha?"透明度":"明るさ",outerLimit:Math.max(4,bounds.margin/IMAGE_SS-6),bounds};
  return {binary,alpha};
}
function makeMask(){return sourceIsImage()?makeImageMask():makeTextMask()}

function recursiveOffsets(limit){
  const scale=+$('spacing').value/7,offsets=[];let accumulated=0;
  for(const distance of BUFFER_DISTANCES){
    accumulated+=distance*scale;
    if(accumulated>=limit-.4)break;
    offsets.push(accumulated);
  }
  return offsets;
}
function strokeGlyphs(target,width,color,operation){
  target.globalCompositeOperation=operation;target.strokeStyle=color;target.lineWidth=width;
  target.lineJoin="round";target.lineCap="round";setTextStyle(target);
  for(const glyph of layout.glyphs)target.strokeText(glyph.char,glyph.x,layout.y);
}
function fillSource(target){
  if(!sourceIsImage()){fillGlyphs(target);return}
  ilctx.globalCompositeOperation="source-over";ilctx.clearRect(0,0,IW,IH);
  ilctx.fillStyle=target.fillStyle;ilctx.fillRect(0,0,IW,IH);
  ilctx.globalCompositeOperation="destination-in";ilctx.drawImage(imageMask,0,0);
  ilctx.globalCompositeOperation="source-over";target.drawImage(imageLines,0,0);
}

function lineColor(side,index,count){
  const glyph=hex($("c1").value)||[51,156,255];
  const inner=hex($("c2").value)||[149,194,236];
  const outer=hex($("c3").value)||[243,136,59];
  const background=hex($("bg").value)||[255,255,255];
  if(!$("gradient").checked)return side==="inside"?inner:outer;
  let t=count>1?index/(count-1):0;
  if($("reverse").checked)t=1-t;
  if(side==="inside"){
    const near=mix(glyph,inner,.38);
    const deep=mix(inner,background,.22);
    return mix(near,deep,t);
  }
  return mix(outer,mix(outer,background,.58),t);
}

function buildTextLineLayer(offsets,side){
  lctx.globalCompositeOperation="source-over";lctx.clearRect(0,0,W,H);
  const width=+$("lineWidth").value;
  for(let i=offsets.length-1;i>=0;i--){
    const distance=offsets[i],color=cssColor(lineColor(side,i,offsets.length));
    strokeGlyphs(lctx,2*distance+width,color,"source-over");
    const innerWidth=2*distance-width;
    if(innerWidth>0)strokeGlyphs(lctx,innerWidth,color,"destination-out");
  }
  lctx.globalCompositeOperation=side==="inside"?"destination-in":"destination-out";lctx.drawImage(mask,0,0);
  lctx.globalCompositeOperation="source-over";
}
function makeBandLookup(offsets,side,width,scale=1){
  const scaledOffsets=offsets.map(distance=>distance*scale),scaledWidth=width*scale;
  const resolution=4,softness=Math.max(1,.75*scale),limit=Math.ceil((scaledOffsets[scaledOffsets.length-1]||0)+scaledWidth+softness+2);
  const nearest=new Int16Array(limit*resolution+1);nearest.fill(-1);
  const coverage=new Uint8Array(nearest.length);
  for(let b=0;b<nearest.length;b++){
    const distance=b/resolution;let best=Infinity,bestIndex=-1;
    for(let i=0;i<scaledOffsets.length;i++){
      const delta=Math.abs(distance-scaledOffsets[i]);if(delta<best){best=delta;bestIndex=i}
    }
    const amount=Math.min(1,Math.max(0,(scaledWidth/2+softness-best)/softness));
    if(amount>0){nearest[b]=bestIndex;coverage[b]=Math.round(amount*255)}
  }
  return {resolution,nearest,coverage,colors:offsets.map((_,i)=>lineColor(side,i,offsets.length))};
}
function buildImageLineLayer(offsets,side){
  ilctx.globalCompositeOperation="source-over";ilctx.clearRect(0,0,IW,IH);
  if(!offsets.length)return;
  const lookup=makeBandLookup(offsets,side,+$("lineWidth").value,IMAGE_SS);
  const field=side==="inside"?distanceField:outsideDistanceField;
  const image=ilctx.createImageData(IW,IH),data=image.data;
  for(let i=0;i<binaryMask.length;i++){
    if(side==="inside"?!binaryMask[i]:binaryMask[i])continue;
    const bin=Math.round(field[i]*lookup.resolution);
    if(bin<0||bin>=lookup.nearest.length)continue;
    const level=lookup.nearest[bin];if(level<0)continue;
    const color=lookup.colors[level],p=i*4;
    data[p]=color[0];data[p+1]=color[1];data[p+2]=color[2];data[p+3]=lookup.coverage[bin];
  }
  ilctx.putImageData(image,0,0);
}
function buildLineLayer(offsets,side){
  if(sourceIsImage())buildImageLineLayer(offsets,side);else buildTextLineLayer(offsets,side);
}

function drawLineRegions(innerOffsets,outerOffsets,target){
  const region=$("lineRegion").value;
  const layer=sourceIsImage()?imageLines:lines;
  if(region!=="outside"){buildLineLayer(innerOffsets,"inside");target.drawImage(layer,0,0)}
  if(region!=="inside"){buildLineLayer(outerOffsets,"outside");target.drawImage(layer,0,0)}
}

function drawRasterBoundary(target){
  ilctx.globalCompositeOperation="source-over";ilctx.clearRect(0,0,IW,IH);
  const color=hex($("c4").value)||[44,41,39],width=Math.max(2,+$("lineWidth").value*1.35)*IMAGE_SS,half=width/2;
  const image=ilctx.createImageData(IW,IH),data=image.data;
  for(let i=0;i<binaryMask.length;i++){
    const distance=binaryMask[i]?distanceField[i]:outsideDistanceField[i];
    const amount=Math.min(1,Math.max(0,(half+IMAGE_SS-distance)/IMAGE_SS));if(amount<=0)continue;
    const p=i*4;data[p]=color[0];data[p+1]=color[1];data[p+2]=color[2];data[p+3]=Math.round(amount*255);
  }
  ilctx.putImageData(image,0,0);target.drawImage(imageLines,0,0);
}
function drawSourceBoundary(target){
  const color=hex($("c4").value)||[44,41,39];
  if(sourceIsImage())drawRasterBoundary(target);
  else strokeGlyphs(target,Math.max(2,+$("lineWidth").value*1.35),cssColor(color),"source-over");
}

function drawDistanceFill(target){
  const width=sourceIsImage()?IW:W,height=sourceIsImage()?IH:H,fieldScale=sourceIsImage()?IMAGE_SS:1;
  const image=target.createImageData(width,height),data=image.data;
  const start=hex($("c1").value)||[51,156,255],end=hex($("c2").value)||[149,194,236],background=hex($("bg").value)||[255,255,255];
  const transparent=$("transparent").checked,mode=$("mode").value,useGradient=$("gradient").checked||mode==="distance";
  const forceCommon=mode==="fill"&&$("lineRegion").value==="outside";
  for(let i=0;i<distanceField.length;i++){
    const p=i*4;
    if(!binaryMask[i]){
      data[p]=background[0];data[p+1]=background[1];data[p+2]=background[2];data[p+3]=transparent?0:255;continue;
    }
    let t=distanceField[i]/(maxDistance*fieldScale);if($("reverse").checked)t=1-t;
    const color=forceCommon?start:(useGradient?mix(start,end,t):start);
    data[p]=color[0];data[p+1]=color[1];data[p+2]=color[2];data[p+3]=maskAlpha[i];
  }
  target.putImageData(image,0,0);
}

function paint(){
  if(!distanceField||!layout||layout.kind!==(sourceIsImage()?"image":"text"))return;
  const started=performance.now(),innerOffsets=recursiveOffsets(maxDistance),outerOffsets=recursiveOffsets(layout.outerLimit),mode=$("mode").value;
  const imageMode=sourceIsImage(),target=imageMode?ioctx:ctx,width=imageMode?IW:W,height=imageMode?IH:H;
  target.globalCompositeOperation="source-over";target.clearRect(0,0,width,height);
  if(mode==="lines"){
    if(!$("transparent").checked){target.fillStyle=$("bg").value;target.fillRect(0,0,width,height)}
    target.fillStyle=$("c1").value;fillSource(target);
    drawLineRegions(innerOffsets,outerOffsets,target);
  }else{
    drawDistanceFill(target);
    if(mode==="fill")drawLineRegions(innerOffsets,outerOffsets,target);
  }
  drawSourceBoundary(target);
  if(imageMode){
    ctx.globalCompositeOperation="source-over";ctx.clearRect(0,0,W,H);
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
    ctx.drawImage(imageOutput,0,0,IW,IH,0,0,W,H);
  }
  const region=$("lineRegion").value,levels=region==="inside"?`内側 ${innerOffsets.length}段`:region==="outside"?`外側 ${outerOffsets.length}段`:`内側 ${innerOffsets.length}段・外側 ${outerOffsets.length}段`;
  const source=sourceIsImage()?`画像 ${layout.maskMode}・閾値 ${$("threshold").value}`:"文字";
  $("status").textContent=`${source}・再帰バッファー ${levels}・最大内接距離 ${maxDistance.toFixed(1)} px・描画 ${(performance.now()-started).toFixed(0)} ms`;
}

async function render(){
  const token=++generation,button=$("run");button.disabled=true;
  if(sourceIsImage()&&!sourceImage){
    ctx.clearRect(0,0,W,H);if(!$("transparent").checked){ctx.fillStyle=$("bg").value;ctx.fillRect(0,0,W,H)}
    binaryMask=maskAlpha=distanceField=outsideDistanceField=layout=null;
    $("status").textContent="画像ファイルを選択してください";button.disabled=false;return;
  }
  $("status").textContent=sourceIsImage()?"画像マスクを解析中…":"文字輪郭を解析中…";
  await new Promise(resolve=>requestAnimationFrame(resolve));
  const started=performance.now(),made=makeMask();
  if(!made){
    binaryMask=maskAlpha=distanceField=outsideDistanceField=layout=null;
    ctx.clearRect(0,0,W,H);if(!$("transparent").checked){ctx.fillStyle=$("bg").value;ctx.fillRect(0,0,W,H)}
    $("status").textContent="スレッショルドを調整してください（形状を検出できません）";button.disabled=false;return;
  }
  const imageMode=sourceIsImage(),processWidth=imageMode?IW:W,processHeight=imageMode?IH:H,processScale=imageMode?IMAGE_SS:1;
  const field=distanceTransform(made.binary,processWidth,processHeight);
  let outside=null;
  if(imageMode){
    const inverse=new Uint8Array(made.binary.length);for(let i=0;i<inverse.length;i++)inverse[i]=made.binary[i]?0:1;
    outside=distanceTransform(inverse,processWidth,processHeight);
  }
  if(token!==generation)return;
  let maximum=1;for(let i=0;i<field.length;i++)if(field[i]>maximum)maximum=field[i];
  binaryMask=made.binary;maskAlpha=made.alpha;distanceField=field;outsideDistanceField=outside;maxDistance=maximum/processScale;
  paint();button.disabled=false;$("status").textContent+=`・解析 ${(performance.now()-started).toFixed(0)} ms`;
}

function bindColor(picker,text){
  $(picker).addEventListener("input",()=>{$(text).value=$(picker).value;paint()});
  $(text).addEventListener("change",()=>{const rgb=hex($(text).value);if(!rgb)return;$(picker).value="#"+rgb.map(v=>v.toString(16).padStart(2,"0")).join("");paint()});
}
bindColor("c1","c1t");bindColor("c2","c2t");bindColor("c3","c3t");bindColor("c4","c4t");bindColor("bg","bgt");

function updateLabels(){
  $("fsV").textContent=$("fs").value;
  $("lsV").textContent=$("letterSpacing").value+" px";
  $("imageScaleV").textContent=$("imageScale").value+"%";
  $("thresholdV").textContent=$("threshold").value;
  $("spV").textContent=(+$("spacing").value/7).toFixed(2)+"×";
  $("lwV").textContent=$("lineWidth").value;
}
function toggleSourceControls(){
  const image=sourceIsImage();$("textSource").hidden=image;$("imageSource").hidden=!image;
}
function scheduleImageRender(){
  clearTimeout(imageRenderTimer);imageRenderTimer=setTimeout(()=>{if(sourceIsImage()&&sourceImage)render()},180);
}
["fs","letterSpacing"].forEach(id=>{
  $(id).addEventListener("input",updateLabels);
  $(id).addEventListener("change",render);
});
["imageScale","threshold"].forEach(id=>$(id).addEventListener("input",()=>{updateLabels();scheduleImageRender()}));
["spacing","lineWidth"].forEach(id=>$(id).addEventListener("input",()=>{updateLabels();paint()}));
["mode","lineRegion","gradient","reverse","transparent"].forEach(id=>$(id).addEventListener("change",paint));
$("sourceType").addEventListener("change",()=>{toggleSourceControls();render()});
$("imageInvert").addEventListener("change",render);
$("text").addEventListener("keydown",event=>{if(event.key==="Enter")render()});
$("font").addEventListener("change",render);$("weight").addEventListener("change",render);

$("fontFile").addEventListener("change",async event=>{
  const file=event.target.files[0];if(!file){localFont=null;render();return}
  try{localFont="Typo2Local";const face=new FontFace(localFont,await file.arrayBuffer());await face.load();document.fonts.add(face);render()}
  catch(error){localFont=null;$("status").textContent="フォントを読み込めませんでした";console.error(error)}
});
$("imageFile").addEventListener("change",event=>{
  const file=event.target.files[0];
  if(!file){sourceImage=null;imageFileName="image";render();return}
  const image=new Image(),url=URL.createObjectURL(file);imageFileName=file.name.replace(/\.[^.]+$/,"")||"image";
  image.onload=()=>{sourceImage=image;URL.revokeObjectURL(url);render()};
  image.onerror=()=>{URL.revokeObjectURL(url);sourceImage=null;$("status").textContent="画像を読み込めませんでした"};
  image.src=url;
});
$("run").addEventListener("click",render);
$("png").addEventListener("click",()=>{
  const sourceName=sourceIsImage()?imageFileName:($("text").value||"logo");
  const safe=sourceName.replace(/[\\/:*?"<>|]+/g,"_");
  const link=document.createElement("a");link.download=safe+"_Typo2Logo.png";link.href=out.toDataURL("image/png");link.click();
});
$("reset").addEventListener("click",()=>location.reload());

toggleSourceControls();updateLabels();render();
</script>
</body>
</html>
